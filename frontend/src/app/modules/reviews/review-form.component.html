<!-- Review Form -->

<div
  class="
    py-16
    bg-gray-50
    min-h-screen
  "
>

  <div class="max-w-2xl mx-auto">

    <div
      class="
        bg-white
        rounded-3xl
        shadow-xl
        border
        border-gray-100
        p-8
      "
    >

      <!-- Title -->

      <div class="mb-8">

        <h2 class="text-3xl font-semibold text-gray-900">
          Leave a Review
        </h2>

        <p class="text-gray-500 mt-2">
          Tell us about your experience at this property
        </p>

      </div>

      <!-- Rating -->

      <div class="mb-7">

        <label class="block text-sm font-medium text-gray-700 mb-3">
          Rating
        </label>

        <div class="flex items-center gap-2">

          <button
            *ngFor="let star of [1,2,3,4,5]"
            type="button"
            (click)="rating = star"
            class="text-4xl transition"
            [ngClass]="
              star <= rating
                ? 'text-yellow-400'
                : 'text-gray-300'
            "
          >
            ★
          </button>

        </div>

      </div>

      <!-- Comment -->

      <div class="mb-7">

        <label class="block text-sm font-medium text-gray-700 mb-3">
          Comment
        </label>

        <textarea
          [(ngModel)]="comment"
          rows="5"
          placeholder="Write your review..."
          class="
            w-full
            rounded-2xl
            border
            border-gray-200
            px-5
            py-4
            text-gray-700
            placeholder-gray-400
            focus:outline-none
            focus:ring-2
            focus:ring-[#d4af65]
            resize-none
          "
        ></textarea>

      </div>

      <!-- Submit Button -->

      <button
        type="button"
        (click)="addReview()"
        class="
          w-full
          bg-[#111111]
          text-white
          py-4
          rounded-2xl
          text-lg
          font-medium
          hover:bg-[#d4af65]
          hover:text-black
          transition
          duration-300
        "
      >
        Submit Review
      </button>

    </div>

  </div>

</div>
