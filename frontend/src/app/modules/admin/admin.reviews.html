<!-- Topbar -->
<header class="bg-white border-b border-stone-200 px-8 py-5 flex items-center justify-between">
  <div>
    <h1 class="font-serif text-2xl text-slate-900">Reviews</h1>
    <p class="text-sm text-stone-500 mt-0.5">{{ today() }}</p>
  </div>
  <div class="flex items-center gap-6">
    <div class="relative">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400">
        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        placeholder="Search..."
        [value]="search()"
        (input)="search.set($any($event.target).value)"
        class="pl-9 pr-3 py-2 text-sm border border-stone-200 rounded-md w-56 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-transparent"
      />
    </div>
    <div class="flex items-center gap-3">
      <img [src]="adminAvatar()" alt="" class="w-9 h-9 rounded-full object-cover" />
      <div class="text-sm">
        <div class="font-medium text-slate-900">{{ adminName() }}</div>
        <div class="text-stone-500">{{ adminRole() }}</div>
      </div>
    </div>
  </div>
</header>

<main class="flex-1 overflow-y-auto p-8">
  <h2 class="font-serif text-xl text-slate-900 mb-5">All Reviews</h2>

  <div class="space-y-4">
    @for (review of reviews(); track review.id) {
      <div class="bg-white rounded-lg border border-stone-200 p-6">
        <div class="flex items-start justify-between gap-6">
          <div class="flex items-start gap-3">
            <img [src]="review.avatar" alt="" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <div class="font-medium text-slate-900">{{ review.guest }}</div>
              <div class="text-xs text-stone-500 mt-0.5">
                {{ review.property }} · {{ review.tripType }} · {{ review.date }}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="text-amber-500 tracking-tight">
              @for (n of [1, 2, 3, 4, 5]; track n) {
                <span [class.text-stone-200]="n > review.rating">★</span>
              }
            </span>
            <button type="button" (click)="approveReview(review.id)" class="text-stone-400 hover:text-emerald-600" aria-label="Approve">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="8 12 11 15 16 9" /></svg>
            </button>
            <button type="button" (click)="deleteReview(review.id)" class="text-stone-400 hover:text-red-600" aria-label="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
            </button>
          </div>
        </div>
        <p class="text-sm text-stone-600 mt-4 leading-relaxed">"{{ review.text }}"</p>
      </div>
    }
  </div>
</main>
