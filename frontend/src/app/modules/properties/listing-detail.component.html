<div *ngIf="!loading(); else loadingTpl" class="bg-[#f8f5f2] min-h-screen">

  <!-- HERO IMAGES -->
  <div class="grid grid-cols-4 grid-rows-2 gap-2 h-[400px]">
    <img 
      [src]="property()?.images?.[0]" 
      class="col-span-2 row-span-2 w-full h-full object-cover"
    />

    <img *ngFor="let img of property()?.images?.slice(1,5)"
         [src]="img"
         class="w-full h-full object-cover" />
  </div>

  <!-- CONTENT -->
  <div *ngIf="property() as p" class="max-w-6xl mx-auto px-6 py-8">

    <!-- Breadcrumb -->
    <p class="text-sm text-gray-500 mb-2">
      Home / Properties / 
      <span class="text-gray-700 font-medium">{{ p.title }}</span>
    </p>

    <!-- Type + Rating -->
    <div class="flex items-center gap-4 mb-3">
      <span class="bg-[#1f3d2b] text-white text-xs px-3 py-1 uppercase tracking-wide">
        {{ p.propertyType }}
      </span>

      <span class="text-yellow-600 font-semibold">
        ★ {{ p.rating }}
      </span>

      <span class="text-gray-500 text-sm">
        ({{ p.reviewsCount }} reviews)
      </span>
    </div>

    <!-- Title -->
    <h1 class="text-4xl font-serif mb-2">
      {{ p.title }}
    </h1>

    <!-- Location -->
    <p class="text-gray-600 mb-6">
      📍 {{ p.location?.address }}, {{ p.location?.city }}
    </p>

    <!-- TABS -->
    <div class="flex gap-8 border-b mb-6 text-sm tracking-wider uppercase">
      <button class="pb-3 border-b-2 border-[#c89b3c] text-black">
        Overview
      </button>

      <button class="pb-3 text-gray-400">
        Rooms ({{ rooms().length }})
      </button>

      <button class="pb-3 text-gray-400">
        Reviews ({{ p.reviewsCount }})
      </button>
    </div>

    <!-- OVERVIEW -->
    <div class="mb-10">
      <p class="text-gray-700 leading-7">
        {{ p.description }}
      </p>
    </div>

    <!-- AMENITIES -->
    <div class="mb-12">
      <h2 class="text-2xl font-serif mb-6">Property Amenities</h2>

      <div class="grid grid-cols-3 gap-4">
        <div 
          *ngFor="let amenity of p.amenities"
          class="flex items-center gap-3 bg-white p-4 border rounded-md"
        >
          <span class="text-[#c89b3c]">✔</span>
          <span class="text-gray-700">{{ amenity }}</span>
        </div>
      </div>
    </div>

    <!-- ROOMS SECTION -->
    <div>
      <h2 class="text-2xl font-serif mb-6">Available Rooms</h2>

      <!-- EMPTY STATE -->
      <div *ngIf="rooms().length === 0" class="text-gray-500 mb-6">
        No rooms available.
      </div>

      <div class="flex flex-col gap-6">
        <app-room-card
          *ngFor="let room of rooms()"
          [room]="room">
        </app-room-card>
      </div>
    </div>

  </div>
</div>

<!-- LOADING -->
<ng-template #loadingTpl>
  <div class="h-screen flex items-center justify-center text-gray-500">
    Loading...
  </div>
</ng-template>
