<div class="bg-[var(--background-color)] py-12">
<section class="max-w-7xl mx-auto px-4 py-12 bg[var(--background-color)]">

  <!-- Section Header -->
  <div class="mb-10">
    <span class="text-xs font-semibold tracking-[0.2em] text-[#b8977e] uppercase">
      Curated Collection
    </span>
    <h2 class="mt-2 text-4xl font-serif text-gray-900">
      Featured Properties
    </h2>
    <p class="mt-2 text-gray-600 text-sm md:text-base">
      Selected by our team for their extraordinary design, setting, and service.
    </p>
    <div class="ml-auto mr-8 -mt-16 w-fit">
  <select
    [(ngModel)]="selectedSort"
    (change)="sortProperties()"
    class="rounded-xl border border-gray-300 bg-white px-5 py-3 text-sm font-medium shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#b8977e]">
    <option value="">Sort By</option>
    <option value="name">Name A → Z</option>
    <option value="-name">Name Z → A</option>
    <option value="price">Price Low → High</option>
    <option value="-price">Price High → Low</option>
  </select>
</div>

  </div>
  <!-- Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-10  bg-[var(--background-color)]">
    @for (property of properties; track property.id||property._id||$index) {
      <div class="group overflow-hidden rounded-2xl bg-[var(--background-color)] shadow-md transition hover:shadow-xl">


        <div class="relative h-72 w-full">

          <img
            [src]="images[$index % images.length]"
            [alt]="property.title"
            class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
          />


          <span class="absolute top-4 left-4 text-xs font-bold tracking-widest text-[var(--primary-color)] drop-shadow-md uppercase">
            Villa
          </span>


          <button class="absolute top-4 right-4 flex h-9 w-9 items-center justify-center rounded-lg bg-black/30 backdrop-blur-md text-white transition hover:bg-black/50">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.684a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </button>
        </div>


        <div class="p-5">
          <p class="text-sm text-gray-500">
            {{ property.location?.city }}, {{ property.location?.country }}
          </p>

          <h3 class="mt-2 text-xl font-semibold text-gray-800">
            {{ property.title }}
          </h3>
        </div>

      </div>
    }
  </div>

</section>
</div>
